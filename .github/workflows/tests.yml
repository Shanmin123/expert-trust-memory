name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # The tests import FINSABER's dataset class, which this repository does not
      # vendor. The commit is the one the dissertation's results were produced with.
      - name: Check out FINSABER
        run: |
          git clone https://github.com/waylonli/FINSABER.git external/FINSABER
          git -C external/FINSABER checkout d7d2dcb477b92b4f580201b93b4e973e2736c530

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest
